<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zumbi FPS 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: Arial, sans-serif; }
        #hud {
            position: absolute; top: 20px; left: 20px; color: #fff;
            font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
        #mira {
            position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
            border: 2px solid #0f0; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #tela-inicio {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; text-align: center;
        }
        h1 { color: #e63946; font-size: 48px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="hud">Pontos: <span id="pontos">0</span> | Vidas: <span id="vidas">3</span></div>
    <div id="mira"></div>
    <div id="tela-inicio">
        <h1>SOBREVIVÊNCIA ZUMBI 3D</h1>
        <p>Clique na tela para jogar</p>
        <p><small>Use o Mouse para mirar | Clique Esquerdo para atirar | W, A, S, D para mover</small></p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com",
                "three/addons/": "https://unpkg.com"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // Configuração da Cena, Câmera e Renderizador
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 10, 60);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1.6;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Iluminação
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Chão
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x2b2d42 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Controles FPS
        const controls = new PointerLockControls(camera, document.body);
        const telaInicio = document.getElementById('tela-inicio');

        telaInicio.addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => telaInicio.style.display = 'none');
        controls.addEventListener('unlock', () => telaInicio.style.display = 'flex');

        // Estado do Jogo
        let pontos = 0;
        let vidas = 3;
        const zumbis = [];
        const balas = [];
        const teclas = { w: false, a: false, s: false, d: false };

        document.addEventListener('keydown', (e) => { if (teclas.hasOwnProperty(e.key.toLowerCase())) teclas[e.key.toLowerCase()] = true; });
        document.addEventListener('keyup', (e) => { if (teclas.hasOwnProperty(e.key.toLowerCase())) teclas[e.key.toLowerCase()] = false; });

        // Sistema de Tiro
        window.addEventListener('mousedown', () => {
            if (!controls.isLocked) return;
            const balaGeo = new THREE.SphereGeometry(0.1, 8, 8);
            const balaMat = new THREE.MeshBasicMaterial({ color: 0xffd166 });
            const bala = new THREE.Mesh(balaGeo, balaMat);
            
            bala.position.copy(camera.position);
            const direcao = new THREE.Vector3();
            camera.getWorldDirection(direcao);
            bala.userData.velocidade = direcao.multiplyScalar(1.2);
            
            scene.add(bala);
            balas.push(bala);
        });

        // Gerador de Zumbis
        function criarZumbi() {
            if (!controls.isLocked) return;
            const zumbiGeo = new THREE.BoxGeometry(1, 2, 1);
            const zumbiMat = new THREE.MeshStandardMaterial({ color: 0x52b788 });
            const zumbi = new THREE.Mesh(zumbiGeo, zumbiMat);

            const angulo = Math.random() * Math.PI * 2;
            const distancia = 25 + Math.random() * 15;
            zumbi.position.set(
                camera.position.x + Math.cos(angulo) * distancia,
                1,
                camera.position.z + Math.sin(angulo) * distancia
            );

            scene.add(zumbi);
            zumbis.push(zumbi);
        }
        setInterval(criarZumbi, 1800);

        // Atualização de HUD e Game Over
        function atualizarHUD() {
            document.getElementById('pontos').innerText = pontos;
            document.getElementById('vidas').innerText = vidas;
        }

        function reiniciarJogo() {
            alert(`Fim de jogo! Sua pontuação final foi: ${pontos}`);
            pontos = 0;
            vidas = 3;
            atualizarHUD();
            zumbis.forEach(z => scene.remove(z));
            zumbis.length = 0;
            camera.position.set(0, 1.6, 0);
            controls.unlock();
        }

        // Loop Principal
        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked) {
                // Movimento do Jogador
                const velocidadeJogador = 0.15;
                if (teclas.w) controls.moveForward(velocidadeJogador);
                if (teclas.s) controls.moveForward(-velocidadeJogador);
                if (teclas.a) controls.moveRight(-velocidadeJogador);
                if (teclas.d) controls.moveRight(velocidadeJogador);

                // Atualizar Balas
                for (let i = balas.length - 1; i >= 0; i--) {
                    const b = balas[i];
                    b.position.add(b.userData.velocidade);

                    if (b.position.distanceTo(camera.position) > 80) {
                        scene.remove(b);
                        balas.splice(i, 1);
                    }
                }

                // Atualizar Zumbis e Colisões
                for (let i = zumbis.length - 1; i >= 0; i--) {
                    const z = zumbis[i];
                    const direcaoJogador = new THREE.Vector3().subVectors(camera.position, z.position);
                    direcaoJogador.y = 0;
                    direcaoJogador.normalize();
                    z.position.add(direcaoJogador.multiplyScalar(0.05));
                    z.lookAt(camera.position.x, 1, camera.position.z);

                    // Colisão Zumbi x Jogador
                    if (z.position.distanceTo(camera.position) < 1.5) {
                        scene.remove(z);
                        zumbis.splice(i, 1);
                        vidas--;
                        atualizarHUD();
                        if (vidas <= 0) reiniciarJogo();
                        continue;
                    }

                    // Colisão Bala x Zumbi
                    for (let j = balas.length - 1; j >= 0; j--) {
                        const b = balas[j];
                        if (b.position.distanceTo(z.position) < 1.2) {
                            scene.remove(z);
                            zumbis.splice(i, 1);
                            scene.remove(b);
                            balas.splice(j, 1);
                            pontos += 100;
                            atualizarHUD();
                            break;
                        }
                    }
                }
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
